# Runtime settings for HeatWatch AI.
# Heatwave thresholds and risk weights live in thresholds.yaml.

api:
  past_days: 7
  forecast_days: 7
  geocoding_url: https://geocoding-api.open-meteo.com/v1/search
  elevation_url: https://api.open-meteo.com/v1/elevation
  archive_url: https://archive-api.open-meteo.com/v1/archive
  forecast_url: https://api.open-meteo.com/v1/forecast
  timezone: Asia/Kolkata
  timeout_s: 30
  max_retries: 4

terrain:
  hilly_min_elevation_m: 1000
  coastal_max_distance_km: 50

geo:
  # Profiles, normals and weather are cached per cell of this size (~11 km).
  grid_step_deg: 0.1
  india_boundary_file: data/static/india_boundary.geojson
  coastline_file: data/static/india_coastline.geojson
  # Points within this distance of the boundary are still accepted (islands, coastal cells).
  boundary_buffer_km: 5

normals:
  # On-demand normals: mean archive Tmax for the same calendar window in each of the
  # last N complete years (one small archive call per year, ~16 call-units per city).
  years: 10
  window_days: 7          # +/- days around each date
  past_days_needed: 7     # normals also needed for the observed days (persistence)
  forecast_days_needed: 7

cache:
  dir: data/cache
  profile_ttl_s: null      # profiles never expire
  weather_ttl_s: 3600      # live weather, about 1 hour per grid cell
  normals_ttl_s: 86400     # normals depend on today's date
  response_ttl_s: 3600     # assembled /api/risk responses
